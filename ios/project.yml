name: MochiArcade
options:
  bundleIdPrefix: com.neuralfoundry
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Mochi Arcade"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.arcade-games"
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeRight UIInterfaceOrientationLandscapeLeft"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeRight UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  MochiArcade:
    type: application
    platform: iOS
    sources:
      - path: MochiArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuralfoundry.mochiarcade
        PRODUCT_NAME: MochiArcade
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    scheme:
      testTargets: []
